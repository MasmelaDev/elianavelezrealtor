# Opcional: Postgres local para desarrollo. Por defecto se recomienda Neon (prod + dev).
# Uso: pnpm db:up  →  DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/realtor pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realtor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
